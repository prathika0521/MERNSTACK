<!DOCTYPE html>
<html>
<head>
    <title>Weather Dashboard</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #e3f2fd;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #card {
            margin-top: 20px;
            padding: 20px;
            background: white;
            display: inline-block;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🌦 Weather Dashboard</h1>

    <input id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <p id="status"></p>

    <div id="card">
        <h2 id="result"></h2>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value;
            const status = document.getElementById("status");
            const result = document.getElementById("result");

            if (city === "") {
                result.innerText = "Please enter a city!";
                return;
            }

            status.innerText = "Loading...";
            result.innerText = "";

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=a1ec2a12ea09fb8425e6fa35068d4bb5&units=metric`
                );

                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();

                status.innerText = "";

                result.innerText =
                    `City: ${data.name}
Temperature: ${data.main.temp}°C
Weather: ${data.weather[0].main}`;
            } catch (error) {
                status.innerText = "";
                result.innerText = "Error: " + error.message;
            }
        }
    </script>

</body>
</html>
